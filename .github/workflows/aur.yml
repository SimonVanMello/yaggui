# Publishes the `yaggui-bin` AUR package from the .deb of a published release. Pull requests that
# touch the packaging build the package from the latest release without publishing it.
# See docs/RELEASING.md.
name: AUR

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/aur.yml
      - scripts/aur.mjs
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
      pkgrel:
        description: Package release, bumped when only the PKGBUILD changes
        default: '1'

concurrency:
  group: aur-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli nodejs namcap

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir release

      - name: Generate the PKGBUILD
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
        run: |
          SHA=$(awk -v f="yaggui_${VERSION}_amd64.deb" '$2 == f { print $1 }' release/SHA256SUMS.txt)
          node scripts/aur.mjs "$VERSION" "$SHA" aur "$PKGREL"

      # makepkg refuses to run as root, and can't install the dependencies without sudo. It
      # downloads the .deb and checks it against the sum.
      - name: Build the package
        working-directory: aur
        run: |
          useradd --create-home builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.makepkg
          diff -u .SRCINFO.makepkg .SRCINFO
          rm .SRCINFO.makepkg
          sed -n 's/^\tdepends = //p' .SRCINFO | xargs pacman -S --noconfirm --needed
          su builder -c 'makepkg --noconfirm'
          namcap PKGBUILD ./*.pkg.tar.zst || true
          pacman -U --noconfirm ./*.pkg.tar.zst
          test -x /usr/bin/yaggui
          ls /usr/share/applications/yaggui.desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: aur

      # The host key is fetched, then checked against the fingerprint published on
      # https://aur.archlinux.org (home page, "SSH fingerprints").
      - name: Trust the AUR host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 ' || {
            echo 'Unexpected host key for aur.archlinux.org' >&2
            exit 1
          }

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/aur
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git clone ssh://aur@aur.archlinux.org/yaggui-bin.git repo
          cp aur/PKGBUILD aur/.SRCINFO repo/
          cd repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'The AUR package is already up to date.'
            exit 0
          fi
          git -c user.name='yaggui release' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update to $(sed -n 's/^\tpkgver = //p' .SRCINFO)-$(sed -n 's/^\tpkgrel = //p' .SRCINFO)"
          git push origin HEAD:master
