# Checks every pull request: the frontend (lint, format, typecheck, Vitest, Playwright on the
# mocked backend) and the Rust backend on the three desktop platforms.
name: CI

on:
  pull_request:
  # Runs on master too: in full when the merged tree was not tested by a pull request, otherwise
  # only to refresh the Rust cache that pull requests restore.
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On master, a merge whose tree is the one of its pull request head was already checked by the
  # pull request run: `tested` is then true. `frontend` (none / format / check / full) and `rust`
  # say what the changed files can break. Jobs skip themselves on these outputs rather than the
  # workflow using `paths-ignore`: a skipped job counts as passed for required checks, one that
  # never starts stays pending. Without a diff (manual run, first commit), everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      frontend: ${{ steps.paths.outputs.frontend || 'full' }}
      rust: ${{ steps.paths.outputs.rust || 'true' }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its first parent: the base branch for a pull request merge commit, the
          # previous master for a push.
          fetch-depth: 2
          persist-credentials: false
      - id: tree
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify 'HEAD^2' > /dev/null &&
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo 'tested=true' >> "$GITHUB_OUTPUT"
          fi
      - id: paths
        if: github.event_name != 'workflow_dispatch'
        run: |
          git rev-parse -q --verify 'HEAD^1' > /dev/null || exit 0
          # Frontend levels: 0 none, 1 format (case + Prettier), 2 check (`pnpm check`), 3 full
          # (+ Playwright). The first matching pattern wins.
          level=0 rust=false
          raise() { if [ "$1" -gt "$level" ]; then level=$1; fi; }
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci.yml | mise.toml | src/ipc/bindings.ts) raise 3; rust=true ;;
              # Embedded in the binary and parsed by a Rust test.
              CHANGELOG.md) raise 1; rust=true ;;
              # Vitest reads the Rust sources (French tone of the error messages).
              src-tauri/*) raise 2; rust=true ;;
              # Generated from the action registry, compared by Vitest.
              website/src/content/docs/_data/shortcuts.json) raise 2 ;;
              # Outside Prettier and the app (website.yml checks the site).
              website/* | docs/* | .claude/* | CLAUDE.md | LICENSE) ;;
              *.md | .github/*) raise 1 ;;
              *) raise 3 ;;
            esac
          done < <(git diff --name-only --no-renames 'HEAD^1' HEAD)
          levels=(none format check full)
          echo "frontend=${levels[$level]}" | tee -a "$GITHUB_OUTPUT"
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend != 'none' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    env:
      LEVEL: ${{ needs.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.LEVEL == 'format'
        run: node scripts/check-case.mjs && pnpm format:check
      - if: env.LEVEL != 'format'
        run: pnpm check
      - if: env.LEVEL == 'full'
        run: pnpm exec playwright install --with-deps chromium
      - if: env.LEVEL == 'full'
        run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # With debug info, the test binaries take ~19 GB: more than a hosted runner has free.
      CARGO_PROFILE_DEV_DEBUG: 0
      TESTED: ${{ needs.changes.outputs.tested == 'true' }}
      # Gated per step, not per job: a skipped matrix job reports one check named
      # `rust (<unexpanded matrix expression>)`, and the required `rust (<os>)` checks stay pending.
      RUST: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - if: env.RUST == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: env.RUST == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - id: cache
        if: env.RUST == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # An already tested tree only rebuilds what pull requests restore, and only on a cache miss.
      - name: Install Linux dependencies
        if: env.RUST == 'true' && runner.os == 'Linux' && (env.TESTED != 'true' || steps.cache.outputs.cache-hit != 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - if: env.RUST == 'true' && runner.os == 'Linux' && env.TESTED != 'true'
        run: cargo fmt --check
      - if: env.RUST == 'true' && (env.TESTED != 'true' || steps.cache.outputs.cache-hit != 'true')
        run: cargo clippy --all-targets --locked -- -D warnings
      # Every failing test binary at once, not only the first one.
      - if: env.RUST == 'true' && env.TESTED != 'true'
        run: cargo test --locked --no-fail-fast
      - if: env.RUST == 'true' && env.TESTED == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: cargo test --locked --no-run
