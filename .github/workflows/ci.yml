# Checks every pull request: the frontend (lint, format, typecheck, Vitest, Playwright on the
# mocked backend) and the Rust backend on the three desktop platforms.
name: CI

on:
  pull_request:
  # Runs on master too: in full when the merged tree was not tested by a pull request, otherwise
  # only to refresh the Rust cache that pull requests restore.
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On master, a merge whose tree is the one of its pull request head was already checked by the
  # pull request run: `tested` is then true. A change that only touches the website (checked by
  # website.yml) sets `app` to false. Jobs skip themselves on these outputs rather than the workflow
  # using `paths-ignore`: a skipped job counts as passed for required checks, one that never starts
  # stays pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      app: ${{ steps.app.outputs.app || 'true' }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its first parent: the base branch for a pull request merge commit, the
          # previous master for a push.
          fetch-depth: 2
          persist-credentials: false
      - id: tree
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify 'HEAD^2' > /dev/null &&
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo 'tested=true' >> "$GITHUB_OUTPUT"
          fi
      - id: app
        if: github.event_name != 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify 'HEAD^1' > /dev/null &&
            ! git diff --name-only 'HEAD^1' HEAD | grep -vqE \
              '^(website/|docs/WEBSITE\.md$|docs/ui/website\.html$|\.github/workflows/(website|docs-version)\.yml$)'; then
            echo 'Website-only change: the app jobs are skipped.'
            echo 'app=false' >> "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # With debug info, the test binaries take ~19 GB: more than a hosted runner has free.
      CARGO_PROFILE_DEV_DEBUG: 0
      TESTED: ${{ needs.changes.outputs.tested == 'true' }}
      # Gated per step, not per job: a skipped matrix job reports one check named
      # `rust (<unexpanded matrix expression>)`, and the required `rust (<os>)` checks stay pending.
      APP: ${{ needs.changes.outputs.app }}
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - if: env.APP == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: env.APP == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - id: cache
        if: env.APP == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # An already tested tree only rebuilds what pull requests restore, and only on a cache miss.
      - name: Install Linux dependencies
        if: env.APP == 'true' && runner.os == 'Linux' && (env.TESTED != 'true' || steps.cache.outputs.cache-hit != 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - if: env.APP == 'true' && runner.os == 'Linux' && env.TESTED != 'true'
        run: cargo fmt --check
      - if: env.APP == 'true' && (env.TESTED != 'true' || steps.cache.outputs.cache-hit != 'true')
        run: cargo clippy --all-targets --locked -- -D warnings
      # Every failing test binary at once, not only the first one.
      - if: env.APP == 'true' && env.TESTED != 'true'
        run: cargo test --locked --no-fail-fast
      - if: env.APP == 'true' && env.TESTED == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: cargo test --locked --no-run
