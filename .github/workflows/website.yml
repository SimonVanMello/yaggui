# Builds the website (website/: landing, every docs version in both locales) on pull requests that
# touch it, and deploys it to GitHub Pages from master: on push, by hand, and when a release is
# published (the download links follow the latest release). See website/README.md.
name: Website

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No `paths` filter on the workflow: a required check that never starts stays pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.files.outputs.site || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      - id: files
        if: github.event_name == 'pull_request'
        run: |
          # The site, the docs, and what the site reads from the app (themes, version, screenshots)
          # or builds from it (the live demo is the frontend itself).
          if git diff --name-only 'HEAD^1' HEAD | grep -qE \
            '^(website/|src/|public/|index\.html$|vite|\.env\.demo$|docs/assets/|package\.json$|\.github/workflows/website\.yml$)'; then
            echo 'site=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site=false' >> "$GITHUB_OUTPUT"
          fi

  # A release event runs on its tag, which the `github-pages` environment refuses (default branch
  # only): it redeploys through a manual run on master instead.
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  build:
    needs: changes
    if: github.event_name != 'release' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The docs of each released version are extracted from its commit (website/versions.json).
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            website/pnpm-lock.yaml
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The live demo is built from the app's frontend (`pnpm build:demo` at the root).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm check
      # Also checks the internal links of the built site.
      - run: pnpm build
        env:
          # Raises the GitHub API rate limit for the latest release lookup.
          GITHUB_TOKEN: ${{ github.token }}
      # M6-3 adds the apt and dnf repositories here, as `dist/apt/` and `dist/rpm/`: a Pages
      # deployment replaces the whole site, so they must be part of this artifact.
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
