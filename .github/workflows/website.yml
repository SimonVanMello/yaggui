# Builds the website (website/: landing, every docs version in both locales) and deploys it to
# Cloudflare Pages: a preview for each pull request that touches it, production from master (on
# push, when a release is published so the download links follow it, and by hand). See
# website/README.md.
name: Website

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No `paths` filter on the workflow: a required check that never starts stays pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.files.outputs.site || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      - id: files
        if: github.event_name == 'pull_request'
        run: |
          # The site, the docs, and what the site reads from the app (themes, version, screenshots)
          # or builds from it (the live demo is the frontend itself).
          if git diff --name-only 'HEAD^1' HEAD | grep -qE \
            '^(website/|src/|public/|index\.html$|vite|\.env\.demo$|docs/assets/|package\.json$|\.github/workflows/website\.yml$)'; then
            echo 'site=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      PRODUCTION: ${{ github.event_name != 'pull_request' }}
      # Absent on pull requests from forks: the site is built but not deployed.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A published release would check out its tag: production is always built from master.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          # Docs versions are the release tags; each one's docs are extracted from its commit.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            website/pnpm-lock.yaml
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The live demo is built from the app's frontend (`pnpm build:demo` at the root).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm check
      # Also checks the internal links of the built site.
      - run: pnpm build
        env:
          # Raises the GitHub API rate limit for the latest release lookup.
          GITHUB_TOKEN: ${{ github.token }}
      # The built demo, in a browser, before anything is deployed.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: .
      - run: pnpm test:demo
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-playwright-results
          path: test-results/
          retention-days: 7

      # Cloudflare branch alias of the deployment: `master` is production, anything else a preview.
      - id: branch
        if: env.CAN_DEPLOY == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$PRODUCTION" = true ]; then
            echo 'name=master' >> "$GITHUB_OUTPUT"
          else
            # The branch name comes from the pull request: keep it to safe characters.
            echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-60)" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          # The wrangler of website/package.json, installed above.
          command: pages deploy dist --project-name=yaggui --branch=${{ steps.branch.outputs.name }} --commit-dirty=true
      - if: env.CAN_DEPLOY == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo '### Website deployed'
            if [ "$PRODUCTION" = true ]; then echo "- Production: https://yaggui.tropico.dev"; fi
            echo "- Deployment: $URL"
            if [ -n "$ALIAS" ]; then echo "- Branch preview: $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.CAN_DEPLOY != 'true'
        run: echo '::notice::No Cloudflare secrets (pull request from a fork?), built but not deployed.'
