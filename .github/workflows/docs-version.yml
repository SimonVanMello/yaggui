# When a release is published, opens a pull request that adds its version to
# website/versions.json, so the site serves that release's docs at /docs/ once merged.
# While versions.json is empty (no complete docs yet), does nothing. See docs/RELEASING.md.
name: Docs version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true

concurrency:
  group: docs-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # A token other than GITHUB_TOKEN, if set, lets the pull request trigger CI.
      GH_TOKEN: ${{ secrets.WEBSITE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.WEBSITE_PR_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: add
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          version=${TAG#v}
          result=$(node website/scripts/add-version.ts "$version" "$sha")
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$result" in
            bootstrap) echo "::notice::versions.json is empty: add the first docs version by hand (website/README.md)." ;;
            present) echo "::notice::$version is already in versions.json." ;;
          esac

      - if: steps.add.outputs.result == 'added'
        env:
          VERSION: ${{ steps.add.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="website/docs-version-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "docs(website): publish the docs of $VERSION" -- website/versions.json
          git push --force-with-lease origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "docs(website): publish the docs of $VERSION" \
            --body "Adds $VERSION ($TAG) to \`website/versions.json\`: once merged, \`/docs/\` serves the docs of $VERSION and the previous version moves to \`/docs/<version>/\`. Opened by the Docs version workflow."
