# Advisory check: which docs pages may be out of date after this pull request? Warnings only
# (job summary and annotations); the job never fails. See "Documentation" in CLAUDE.md.
name: Docs impact

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: docs-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The description goes through the environment, never into the script text.
      - name: Report the docs pages that may need an update
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/docs-impact.mjs --github --base "$BASE_SHA"
