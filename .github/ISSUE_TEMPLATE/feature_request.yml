name: Feature request
description: Something yaggui could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like yaggui to help. Mention how other Git clients do it if that is useful.
    validations:
      required: false
