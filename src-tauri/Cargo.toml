[package]
name = "yaggui"
version = "0.2.0"
description = "yaggui, a fast cross-platform graphical Git client"
edition = "2024"
license = "GPL-3.0-or-later"
# specta 2.0.0-rc.25 needs 1.93 (debug_closure_helpers), Tauri 2.12 needs 1.90.
rust-version = "1.93"
default-run = "yaggui"
publish = false

[lib]
name = "yaggui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# An example, not a `[[bin]]`: the bundler ships every binary target of the package.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[[example]]
name = "graph-bench"
path = "examples/graph_bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25" }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "sha1", "basic", "status", "dirwalk"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
# Avatar downloads (F-033): blocking, no async runtime, TLS through rustls (no OpenSSL to ship).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Self-update of the release installers (SPEC §10), used from Rust only: no updater permission
# is granted to the webview. rustls, like ureq.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# Already in the lockfile through Tauri: version comparison of the update check.
semver = "1"

# Already in the lockfile through Tauri: `kill` on the process group of a cancelled command.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Already in the lockfile through Tauri: CreateProcessW for the terminal (see system/terminal.rs),
# job objects to kill the process tree of a cancelled command (see git/cli.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
